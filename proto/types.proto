syntax = "proto3";

option go_package = "github.com/ArditZubaku/blockchain/proto";

service Node {
  rpc Handshake(Version) returns (Version);
  rpc HandleTransaction(Transaction) returns (Ack);
}

message Version {
  string version = 1;
  int32 height = 2;
  string listen_addr = 3;
}

message Ack {}

message Block {
  Header header = 1;
  // this how you declare an array
  repeated Transaction transactions = 2;
}

message Header {
  int32 version = 1;
  // if you have 10 blocks you have a height of 10
  int32 height = 2;
  bytes previous_hash = 3;
  bytes root_hash = 4; // merkle root of transactions
  int64 timestamp = 5;
}

message TxInput {
  // the previous hash of the transaction
  // containing the output we want to spend
  bytes previous_tx_hash = 1;
  // the index of the output of the previous transaction
  // we want to spend
  uint32 previous_out_idx = 2;
  bytes public_key = 3;
  bytes signature = 4;
}

message TxOutput {
  int64 amount = 1;
  bytes address = 2;
}

message Transaction {
  int32 version = 1;
  repeated TxInput inputs = 2;
  repeated TxOutput outputs = 3;
}
